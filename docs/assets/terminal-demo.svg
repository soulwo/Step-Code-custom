<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Step Code Custom terminal help</title>
  <desc id="desc">A terminal window showing selected real output from step --help in version 0.1.0.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#backdrop)"/>
  <circle cx="1060" cy="80" r="190" fill="#7c3aed" opacity="0.10"/>
  <circle cx="100" cy="680" r="230" fill="#2563eb" opacity="0.10"/>
  <g filter="url(#shadow)">
    <rect x="48" y="42" width="1104" height="636" rx="18" fill="#0d1117" stroke="#475569" stroke-width="1.5"/>
    <path d="M66 42h1068a18 18 0 0 1 18 18v42H48V60a18 18 0 0 1 18-18z" fill="#161b22"/>
    <circle cx="82" cy="72" r="7" fill="#ff5f57"/>
    <circle cx="106" cy="72" r="7" fill="#febc2e"/>
    <circle cx="130" cy="72" r="7" fill="#28c840"/>
    <text x="600" y="78" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">step — terminal</text>
    <rect x="1000" y="59" width="118" height="26" rx="13" fill="#21262d"/>
    <text x="1059" y="77" text-anchor="middle" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="13">v0.1.0</text>

    <text x="82" y="143" fill="#e6edf3" font-family="Cascadia Code, Consolas, monospace" font-size="21">
      <tspan fill="#7ee787">$</tspan><tspan> step --help</tspan>
    </text>
    <text x="82" y="184" fill="#e6edf3" font-family="Cascadia Code, Consolas, monospace" font-size="19" font-weight="600">step - AI coding assistant with read, bash, edit, write tools</text>
    <text x="82" y="224" fill="#79c0ff" font-family="Cascadia Code, Consolas, monospace" font-size="19" font-weight="600">Usage:</text>
    <text x="106" y="254" fill="#c9d1d9" font-family="Cascadia Code, Consolas, monospace" font-size="19">step [options] [--] [@files...] [messages...]</text>

    <text x="82" y="306" fill="#79c0ff" font-family="Cascadia Code, Consolas, monospace" font-size="19" font-weight="600">Commands:</text>
    <text x="106" y="338" fill="#c9d1d9" font-family="Cascadia Code, Consolas, monospace" font-size="18">
      <tspan fill="#d2a8ff">step login</tspan><tspan>                   Sign in with the Step account (OAuth)</tspan>
      <tspan x="106" dy="32" fill="#d2a8ff">step logout</tspan><tspan>                  Remove the stored Step credential</tspan>
      <tspan x="106" dy="32" fill="#d2a8ff">step list</tspan><tspan>                    List installed extensions from settings</tspan>
      <tspan x="106" dy="32" fill="#d2a8ff">step update</tspan><tspan>                  Update step, extensions, or model catalogs</tspan>
    </text>

    <text x="82" y="486" fill="#79c0ff" font-family="Cascadia Code, Consolas, monospace" font-size="19" font-weight="600">Options:</text>
    <text x="106" y="518" fill="#c9d1d9" font-family="Cascadia Code, Consolas, monospace" font-size="18">
      <tspan fill="#d2a8ff">--print, -p</tspan><tspan>                  Non-interactive mode: process prompt and exit</tspan>
      <tspan x="106" dy="32" fill="#d2a8ff">--continue, -c</tspan><tspan>               Continue previous session</tspan>
      <tspan x="106" dy="32" fill="#d2a8ff">--resume, -r [path|id]</tspan><tspan>       Resume a session directly or open a selector</tspan>
      <tspan x="106" dy="32" fill="#d2a8ff">--model &lt;pattern&gt;</tspan><tspan>            Model pattern or ID</tspan>
      <tspan x="106" dy="32" fill="#d2a8ff">--plan</tspan><tspan>                       Start in plan mode</tspan>
    </text>
    <text x="82" y="656" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="14">Selected output from the real `step --help` command · Step Code Custom 0.1.0</text>
  </g>
</svg>
