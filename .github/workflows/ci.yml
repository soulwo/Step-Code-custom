name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep bubblewrap socat
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      - name: Smoke standalone bundle
        run: |
          node packages/coding-agent/dist/bundle/step.js --version
          node packages/coding-agent/dist/bundle/step.js --help > /dev/null
          node scripts/profile-coding-agent-node.mjs --mode rpc --bundle --runs 1 --isolated-agent-dir --skip-build

      - name: Smoke sandbox extension
        # Hosted runners do not grant the runner user CAP_NET_ADMIN, which
        # bwrap needs to configure loopback in its isolated network namespace.
        # Run only this probe as root on the disposable CI VM.
        run: sudo --preserve-env=PATH node scripts/smoke-sandbox-extension.mjs

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm test
